name: Trigger auto deployment for anchor-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/anchor-api-AutoDeployTrigger-1a268a0c-4475-4df3-9f27-53224299e160.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ANCHORAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ANCHORAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ANCHORAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: tsceacrdemo.azurecr.io
          registryUsername: ${{ secrets.ANCHORAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ANCHORAPI_REGISTRY_PASSWORD }}
          containerAppName: anchor-api
          resourceGroup: tsce-demo-rg
          imageToBuild: tsceacrdemo.azurecr.io/anchor-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


